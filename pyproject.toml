[project]
name = "biclique-cop"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "scipy",
    "cvxpy",
    "clarabel",
    "scs",
    "matplotlib",
    "sympy>=1.14.0",
    "mosek==11.2.6",
]

[tool.uv]
package = false

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
